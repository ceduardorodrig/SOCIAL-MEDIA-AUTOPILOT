version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Majors are never ignored (an ignore also blocks security fixes needing a
    # major bump): they arrive as separate PRs, minor+patch are grouped.
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Ungrouped on purpose: every action bump, major included, is its own PR.
