<?xml version="1.0" encoding="UTF-8"?>
<!-- default-card — fallback card template (1200x1200).
     Used ONLY when a persona pack declares no `visual.template`. A real persona
     ships its own template under `personas/<slug>/visual/`; two personas must
     never share one (identity separation, HB-032).

     The template consumes the persona palette through placeholders filled by
     crates/autopilot-publish/src/card.rs:
       {{ARIA}} {{TITLE_LINES}} {{BODY_LINES}} {{FOOTER}}   — content
       {{BG}} {{BG_DEEP}} {{ACCENT}} {{SECONDARY}} {{TEXT}} — palette
       {{FONT_FAMILY}} {{TITLE_WEIGHT}} {{MOTIF}}           — typography/motif
     This file is versioned: a visual change is a new template file, never an
     in-place edit. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"
     role="img" aria-label="{{ARIA}}">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{BG}}"/>
      <stop offset="1" stop-color="{{BG_DEEP}}"/>
    </linearGradient>
    <linearGradient id="card-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{{SECONDARY}}"/>
      <stop offset="1" stop-color="{{ACCENT}}"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#card-bg)"/>

  <!-- faint blueprint grid: terminal / schematic feel -->
  <g stroke="{{SECONDARY}}" stroke-width="2" opacity="0.18">
    <path d="M150 0V1200M300 0V1200M450 0V1200M600 0V1200M750 0V1200M900 0V1200M1050 0V1200"/>
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M0 750H1200M0 900H1200M0 1050H1200"/>
  </g>

  <rect x="0" y="0" width="1200" height="12" fill="url(#card-accent)"/>

  <!-- terminal prompt accent (the persona's motif) -->
  <g transform="translate(96,96)" fill="none" stroke="{{SECONDARY}}" stroke-width="9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6l26 24-26 24"/>
    <path d="M52 54h60"/>
  </g>

  <text x="1104" y="132" text-anchor="end"
        font-family="'{{FONT_FAMILY}}',sans-serif" font-size="28" font-weight="{{TITLE_WEIGHT}}"
        letter-spacing="4" fill="{{ACCENT}}">{{MOTIF}}</text>

  <text x="96" y="280" font-family="'{{FONT_FAMILY}}',sans-serif"
        font-size="68" font-weight="{{TITLE_WEIGHT}}" fill="{{TEXT}}" letter-spacing="-1">{{TITLE_LINES}}</text>

  <rect x="96" y="420" width="150" height="8" rx="4" fill="{{ACCENT}}"/>

  <text x="96" y="500" font-family="'{{FONT_FAMILY}}',sans-serif"
        font-size="54" fill="{{TEXT}}">{{BODY_LINES}}</text>

  <text x="96" y="1120" font-family="'{{FONT_FAMILY}}',monospace"
        font-size="32" fill="{{SECONDARY}}">{{FOOTER}}</text>
</svg>
