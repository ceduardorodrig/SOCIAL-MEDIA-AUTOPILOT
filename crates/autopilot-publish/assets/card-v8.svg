<?xml version="1.0" encoding="UTF-8"?>
<!-- card-v8 — "cellar": burgundy card (1200x1200), wide-tracked title over a faint plus grid.
     Placeholders ({{ARIA}}, {{TITLE_LINES}}, {{BODY_LINES}}, {{FOOTER}}) are filled by
     crates/autopilot-publish/src/card.rs. Versioned: a visual change is a new file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"
     role="img" aria-label="{{ARIA}}">
  <defs>
    <linearGradient id="v8-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0a12"/>
      <stop offset="1" stop-color="#40101c"/>
    </linearGradient>
    <pattern id="v8-plus" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M48 34v28M34 48h28" stroke="#f59e0b" stroke-width="4"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#v8-bg)"/>
  <rect width="1200" height="1200" fill="url(#v8-plus)" opacity="0.16"/>
  <rect x="96" y="96" width="1008" height="6" fill="#f59e0b" opacity="0.9"/>

  <text x="96" y="300" font-family="'DejaVu Sans','Liberation Sans',sans-serif"
        font-size="64" font-weight="700" fill="#ffe4e6" letter-spacing="6">{{TITLE_LINES}}</text>

  <text x="96" y="520" font-family="'DejaVu Sans','Liberation Sans',sans-serif"
        font-size="52" fill="#fda4af">{{BODY_LINES}}</text>

  <text x="96" y="1120" font-family="'DejaVu Sans Mono','Liberation Mono',monospace"
        font-size="30" fill="#fbbf24" letter-spacing="2">{{FOOTER}}</text>
</svg>
