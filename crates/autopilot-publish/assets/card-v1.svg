<?xml version="1.0" encoding="UTF-8"?>
<!-- card-v1 — deterministic Bluesky post-card template (1200x1200).
     Placeholders ({{ARIA}}, {{TITLE_LINES}}, {{BODY_LINES}}, {{FOOTER}}) are filled by
     crates/autopilot-publish/src/card.rs. This file is versioned: a visual change is a
     new template file plus a new CARD_TEMPLATE_VERSION, never an in-place edit.
     Palette matches the persona avatar (dark slate, amber + green accents). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"
     role="img" aria-label="{{ARIA}}">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="card-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#card-bg)"/>

  <!-- faint blueprint grid: terminal / schematic feel -->
  <g stroke="#1e2b42" stroke-width="2" opacity="0.55">
    <path d="M150 0V1200M300 0V1200M450 0V1200M600 0V1200M750 0V1200M900 0V1200M1050 0V1200"/>
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M0 750H1200M0 900H1200M0 1050H1200"/>
  </g>

  <rect x="0" y="0" width="1200" height="12" fill="url(#card-accent)"/>

  <!-- terminal prompt accent (same motif as the persona avatar) -->
  <g transform="translate(96,96)" fill="none" stroke="#34d399" stroke-width="9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6l26 24-26 24"/>
    <path d="M52 54h60"/>
  </g>

  <text x="96" y="280" font-family="'DejaVu Sans','Liberation Sans',sans-serif"
        font-size="68" font-weight="700" fill="#f8fafc" letter-spacing="-1">{{TITLE_LINES}}</text>

  <rect x="96" y="420" width="150" height="8" rx="4" fill="#f59e0b"/>

  <text x="96" y="500" font-family="'DejaVu Sans','Liberation Sans',sans-serif"
        font-size="54" fill="#cbd5e1">{{BODY_LINES}}</text>

  <text x="96" y="1120" font-family="'DejaVu Sans Mono','Liberation Mono',monospace"
        font-size="32" fill="#34d399">{{FOOTER}}</text>
</svg>
